name: Tooling contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tooling:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/verify_antislop.py
      - run: python -m unittest discover -s tests -p test_antislop.py -v
      - run: python -m unittest discover -s tests -p test_resume_catalog.py -v
      - run: python -m unittest discover -s tests -p test_native_boot_probe.py -v
      - run: python -m unittest discover -s tests -p test_copilot_bridge.py -v
      - run: python -m unittest discover -s tests -p test_adviser_pool.py -v
      - run: python -m unittest discover -s tests -p test_native_pipeline.py -v
