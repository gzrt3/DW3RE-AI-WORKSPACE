name: Tooling contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tooling:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, Node 24
        with:
          python-version: '3.12'
      - run: python tools/verify_antislop.py
      - run: python tools/agent_reach_research.py verify
      - run: python -m unittest discover -s tests -p test_agent_reach_research.py -v
      - run: python -m unittest discover -s tests -p test_antislop.py -v
      - run: python -m unittest discover -s tests -p test_adviser_capacity.py -v
      - run: python -m unittest discover -s tests -p test_adviser_conservation.py -v
      - run: python -m unittest discover -s tests -p test_resume_catalog.py -v
      - run: python -m unittest discover -s tests -p test_native_boot_probe.py -v
      - run: python -m unittest discover -s tests -p test_copilot_bridge.py -v
      - run: python -m unittest discover -s tests -p test_adviser_pool.py -v
      - run: python -m unittest discover -s tests -p test_native_pipeline.py -v
