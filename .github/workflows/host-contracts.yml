name: Host contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: windows-2022
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python scripts/check_public_tree.py
      - run: cmake -S research/combined_session -B out/contracts -G "Visual Studio 17 2022" -A x64
      - run: cmake --build out/contracts --config ${{ matrix.configuration }} --parallel 4
      - run: ctest --test-dir out/contracts -C ${{ matrix.configuration }} --output-on-failure
      - run: python -m pip --isolated install --index-url https://pypi.org/simple --require-hashes -r research/pcsx2_bridge/requirements.txt
      - run: python -B research/pcsx2_bridge/draw_contracts.py
